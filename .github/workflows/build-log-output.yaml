name: Build and publish Log output

on:
  push:
    branches:
      - main
    paths:
      - "log_output/app.py"
      - "log_output/server.py"
      - "log_output/Dockerfile"
      - ".github/workflows/build-log-output.yaml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: log-output-gitops
  cancel-in-progress: false

env:
  PROJECT_ID: gen-lang-client-0541268770
  IMAGE: europe-north1-docker.pkg.dev/gen-lang-client-0541268770/dwk-images/log-output

jobs:
  build-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/323761286419/locations/global/workloadIdentityPools/gh-dwk/providers/github
          service_account: github-todo-deployer@gen-lang-client-0541268770.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" ./log_output
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tag
        working-directory: log_output
        run: |
          kustomize edit set image "$IMAGE=$IMAGE:$GITHUB_SHA"

      - name: Commit updated configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add log_output/kustomization.yaml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Release Log output $GITHUB_SHA"
          git push origin HEAD:main