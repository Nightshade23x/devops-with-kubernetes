
name: Deploy Todo to GKE

on:
  push:
    branches: [main]
    paths:
      - "the_project/**"
      - "todo_backend/**"
      - "todo_postgres/**"
      - "todo_cronjob/**"
      - "gke_project/**"
      - "kustomization.yaml"
      - ".github/workflows/deploy-todo-gke.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: todo-gke-deployment
  cancel-in-progress: false

env:
  PROJECT_ID: gen-lang-client-0541268770
  REGION: europe-north1
  CLUSTER: dwk-gke
  IMAGE_BASE: europe-north1-docker.pkg.dev/gen-lang-client-0541268770/dwk-images

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/323761286419/locations/global/workloadIdentityPools/gh-dwk/providers/github
          service_account: github-todo-deployer@gen-lang-client-0541268770.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push images
        run: |
          docker build -t "$IMAGE_BASE/todo-app:$GITHUB_SHA" ./the_project
          docker push "$IMAGE_BASE/todo-app:$GITHUB_SHA"

          docker build -t "$IMAGE_BASE/todo-backend:$GITHUB_SHA" ./todo_backend
          docker push "$IMAGE_BASE/todo-backend:$GITHUB_SHA"

          docker build -t "$IMAGE_BASE/todo-cronjob:$GITHUB_SHA" ./todo_cronjob
          docker push "$IMAGE_BASE/todo-cronjob:$GITHUB_SHA"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Update Kustomize image tags
        run: |
          sed -i "s/newTag: \"3.5\"/newTag: \"$GITHUB_SHA\"/g" kustomization.yaml
          kubectl kustomize . | grep "image:"

      - name: Deploy to GKE
        run: |
          kubectl apply -k .

          kubectl scale statefulset/todo-postgres --replicas=1 -n project
          kubectl rollout status statefulset/todo-postgres -n project --timeout=20m

          kubectl scale deployment/todo-backend --replicas=1 -n project
          kubectl rollout status deployment/todo-backend -n project --timeout=20m

          kubectl scale deployment/todo-app --replicas=1 -n project
          kubectl rollout status deployment/todo-app -n project --timeout=20m

          kubectl patch cronjob wikipedia-reminder -n project --type=merge -p '{"spec":{"suspend":false}}'

      - name: Verify deployment
        run: |
          kubectl get deployments,statefulsets,cronjobs -n project
          kubectl get pods -n project
          kubectl get gateway -n project
