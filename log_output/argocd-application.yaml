apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: log-output
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Nightshade23x/devops-with-kubernetes.git
    targetRevision: main
    path: log_output

  destination:
    server: https://kubernetes.default.svc
    namespace: exercises

  syncPolicy:
    automated:
      prune: true
      selfHeal: true