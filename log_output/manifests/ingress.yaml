
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-output
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /todos
            pathType: Exact
            backend:
              service:
                name: todo-backend
                port:
                  number: 3000

          - path: /todo
            pathType: Exact
            backend:
              service:
                name: todo-app
                port:
                  number: 3000

          - path: /todo/
            pathType: Prefix
            backend:
              service:
                name: todo-app
                port:
                  number: 3000

          - path: /pingpong
            pathType: Exact
            backend:
              service:
                name: ping-pong
                port:
                  number: 3000

          - path: /
            pathType: Exact
            backend:
              service:
                name: log-output
                port:
                  number: 3000
