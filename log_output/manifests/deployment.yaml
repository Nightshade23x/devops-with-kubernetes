
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-writer
          image: log-output:2.5
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "app.py"]
          volumeMounts:
            - name: shared-data
              mountPath: /shared

        - name: log-reader
          image: log-output:2.5
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "server.py"]
          ports:
            - containerPort: 3000
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: shared-data
              mountPath: /shared
            - name: config-data
              mountPath: /config
              readOnly: true

      volumes:
        - name: shared-data
          emptyDir: {}
        - name: config-data
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt
