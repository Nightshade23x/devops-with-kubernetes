
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-writer
          image: log-output:2.1
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "app.py"]
          volumeMounts:
            - name: shared-data
              mountPath: /shared

        - name: log-reader
          image: log-output:2.1
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "server.py"]
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: shared-data
              mountPath: /shared

      volumes:
        - name: shared-data
          emptyDir: {}
