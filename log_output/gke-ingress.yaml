
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: applications-ingress
  namespace: exercises
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          - path: /pingpong
            pathType: ImplementationSpecific
            backend:
              service:
                name: ping-pong
                port:
                  number: 3000

          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: log-output
                port:
                  number: 3000
