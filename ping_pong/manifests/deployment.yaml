
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
  namespace: exercises
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ping-pong:2.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: ping-pong-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: pingpong
            - name: DB_USER
              value: pingpong
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ping-pong-db-secret
                  key: POSTGRES_PASSWORD
