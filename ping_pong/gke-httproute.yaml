
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ping-pong-route
  namespace: exercises
spec:
  parentRefs:
    - name: applications-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /pingpong
      backendRefs:
        - name: ping-pong
          port: 3000
