apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-nats
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-nats
  template:
    metadata:
      labels:
        app: todo-nats
    spec:
      containers:
        - name: nats
          image: nats:2.15-alpine
          ports:
            - name: client
              containerPort: 4222
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
